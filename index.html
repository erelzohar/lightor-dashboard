<!DOCTYPE html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/lightor.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/lightor192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/lightor50.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>Lightor</title>
    <meta name="title" content="Lightor">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dashboard.lightor.app/">
    <meta property="og:title" content="Lightor">
    <meta property="og:image" content="https://dashboard.lightor.app/lightor.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://dashboard.lightor.app/">
    <meta property="twitter:title" content="Lightor">
    <meta property="twitter:image" content="https://dashboard.lightor.app/lightor.png">

    <!-- Theme Color -->
    <meta name="theme-color" content="#8b5cf6">
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Apple Touch Icons -->
    <!-- LT-396: iOS draws no transparency (a web clip fills it black): the logo on lavender. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
