apply plugin: 'com.android.application'

android {
    namespace = "app.lightor.dashboard"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.lightor.dashboard"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Play upload key (LT-431). The keystore and its passwords live outside the
    // repo, in ~/.lightor-android/keystore.properties (or the file named by
    // LIGHTOR_KEYSTORE_PROPERTIES); without it a release build is left unsigned.
    def keystorePropsFile = file(System.getenv('LIGHTOR_KEYSTORE_PROPERTIES') ?: "${System.getProperty('user.home')}/.lightor-android/keystore.properties")
    signingConfigs {
        if (keystorePropsFile.exists()) {
            def keystoreProps = new Properties()
            keystorePropsFile.withInputStream { keystoreProps.load(it) }
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // MainActivity's placeholder FirebaseApp (LT-128) needs FirebaseApp on the
    // app's own classpath: the capawesome plugins pull Firebase in as
    // `implementation`, which does not reach this module (LT-431). Same version
    // the plugins resolve, so nothing is upgraded.
    implementation "com.google.firebase:firebase-common:$firebaseCommonVersion"
}

apply from: 'capacitor.build.gradle'

// LT-128/LT-129: google-services.json is git-ignored and not in the repo yet.
// The app must build without it (no push, no native Google Sign-In until it
// lands), so the plugin is applied only when the file exists.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn("android/app/google-services.json not found: google-services plugin not applied, push and native Google Sign-In are off")
}
