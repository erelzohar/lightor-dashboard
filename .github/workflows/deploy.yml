name: Deploy

# Deploys on every push to main. Also runnable by hand from the Actions tab
# (workflow_dispatch) — useful when a change is coupled to the backend and the
# two have to land in a specific order.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys of the same app overlap; a half-swapped dist directory
# is the one state worse than an old one.
concurrency:
  group: deploy-lightor-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Authorise the runner against the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf "%s\n" "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key so a hijacked DNS/IP cannot silently receive a deploy.
          ssh-keyscan -H "${DEPLOY_HOST#*@}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: KEY="$HOME/.ssh/deploy_key" ./deploy.sh

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
