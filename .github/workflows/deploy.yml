name: Deploy

# Deploys on every push to main. Also runnable by hand from the Actions tab
# (workflow_dispatch) — useful when a change is coupled to the backend and the
# two have to land in a specific order.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys of the same app overlap; a half-swapped dist directory
# is the one state worse than an old one.
concurrency:
  group: deploy-lightor-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # LT-039 shipped a hooks-order crash the repo's own eslint config would
      # have flagged; nothing ran it. This gate is hooks-rules-only until the
      # pre-existing lint debt is cleared (LT-040), then it becomes `npm run lint`.
      - name: Lint (hooks rules)
        run: npm run lint:hooks

      - name: Authorise the runner against the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          host="${DEPLOY_HOST#*@}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf "%s\n" "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # A private key is multi-line. It arrived here as a single line once,
          # because the newlines were lost pasting it into the secret, and ssh
          # answered with a bare "Permission denied (publickey)" that named the
          # server rather than the key. Check the shape before blaming the box.
          lines=$(wc -l < ~/.ssh/deploy_key)
          if [ "$lines" -lt 3 ]; then
            echo "✗ DEPLOY_SSH_KEY is $lines line(s) — its newlines were lost."
            echo "  Re-set it from the file, never by pasting:"
            echo "  gh secret set DEPLOY_SSH_KEY -R <repo> < ~/.ssh/lightor-deploy-ci"
            exit 1
          fi

          # Pin the host key so a hijacked DNS/IP cannot silently receive a deploy.
          # Deliberately not silenced: a timeout here means the AWS security group
          # is not admitting the runner, and that is worth saying out loud.
          if ! ssh-keyscan -T 10 -H "$host" >> ~/.ssh/known_hosts; then
            echo "✗ cannot reach $host:22 from this runner."
            echo "  The server firewall is open, so this is the security group."
            exit 1
          fi

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: KEY="$HOME/.ssh/deploy_key" ./deploy.sh

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
